name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------------
      # 1. Checkout repository code
      # ----------------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 2. Setup Node.js environment
      # ----------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ----------------------------------------------------------------
      # 3. Install project dependencies
      # ----------------------------------------------------------------
      - name: Install Dependencies
        run: npm ci

      # ----------------------------------------------------------------
      # 4. Build web production assets
      # ----------------------------------------------------------------
      - name: Build Web Assets
        run: npm run build

      # ----------------------------------------------------------------
      # 5. Setup Java Development Kit (JDK 17)
      # ----------------------------------------------------------------
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ----------------------------------------------------------------
      # 6. Add & Sync Android platform with Capacitor
      # ----------------------------------------------------------------
      - name: Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      # ----------------------------------------------------------------
      # 7. Setup Android SDK tools
      # ----------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ----------------------------------------------------------------
      # 8. Give Gradle execution permission
      # ----------------------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # ----------------------------------------------------------------
      # 9. Check Gradle environment
      # ----------------------------------------------------------------
      - name: Check Gradle version
        working-directory: android
        run: ./gradlew --version

      # ----------------------------------------------------------------
      # 10. Build Android APK file
      # ----------------------------------------------------------------
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      # ----------------------------------------------------------------
      # 11. Rename and prepare output APK
      # ----------------------------------------------------------------
      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PhotoGallery.apk

      # ----------------------------------------------------------------
      # 12. Upload APK to GitHub Actions
      # ----------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoGallery-APK
          path: PhotoGallery.apk
          if-no-files-found: error
          retention-days: 30